<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>DataOps Login</title>
</head>
<body>
  <main class="container">
        <form id="loginForm">
             <h1>Login DataOps</h1>
            <div class="input-box">
                 <input placeholder="Usuário" type="email" id="loginUser" autocomplete="username" required>
                 <i class='bx bx-user'></i>
            </div>
            <div class="input-box">
                 <input placeholder="Senha" type="password" id="loginPassword" autocomplete="current-password" required>
                 <i class='bx bx-lock-alt'></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Lembrar Senha
                </label>
                <a href="Esqueci-a-senha.html">Esqueci a senha</a>
            </div>

            <p class="form-message" id="loginMessage" role="alert" aria-live="polite" hidden></p>

            <button type="submit" class="Login">Login</button>

            <div class="register-link">
                <p>O acesso ao DataOps é somente por convite.</p>
            </div>
        </form>
  </main>

  <script type="module" src="../JS/pages/login.js"></script>
</body>
</html>
